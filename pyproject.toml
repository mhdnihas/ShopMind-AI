[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopmind-ai"
version = "0.1.0"
description = "Multi-tenant order-support assistant for ShopHub (LangGraph orchestrator + JSON-RPC orders sub-agent)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # HTTP services (store API, sub-agent, chat API)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    # Config + validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Agents
    "langgraph>=0.6",
    "langchain-core>=0.3",
    # Persistence (R7)
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    # Eval cases
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Real model provider. Not needed for fake-LLM mode, tests or evals.
google = ["langchain-google-genai>=4.4"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=1.4",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["common*", "store_api*", "orders_agent*", "orchestrator*", "evals*"]

[tool.setuptools.package-data]
orchestrator = ["static/*"]
evals = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
